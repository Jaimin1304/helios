<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Helios</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23ffb347'/></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="view" tabindex="0" role="application" aria-label="Interactive true-scale solar system" data-i18n-aria="canvasLabel"></canvas>

    <!-- Body name labels (DOM overlay, clickable) -->
    <div id="labels"></div>
    <!-- Ecliptic frame tick layer -->
    <div id="gridticks"></div>
    <!-- Lagrange point label layer -->
    <div id="lpoints"></div>

    <div id="hud">
      <div id="topbar">
        <div class="brand">HELIOS<span data-i18n="brandSub"></span></div>
        <div id="mode-chip" class="chip"></div>
        <div id="clock-chip" class="chip mono"></div>
        <div id="grid-chip" class="chip hidden"></div>
        <div id="lagrange-chip" class="chip hidden"></div>
      </div>

      <div id="info" class="panel hidden">
        <div class="info-title">
          <span id="info-name">—</span><span id="info-en"></span>
          <button id="info-toggle" type="button" aria-expanded="false" data-i18n-aria="infoExpand">+</button>
        </div>
        <dl id="info-rows"></dl>
        <aside id="info-texture-note" class="info-texture-note hidden" role="note">
          <strong id="info-texture-note-title"></strong>
          <span id="info-texture-note-body"></span>
        </aside>
        <div class="info-hint" data-i18n="infoHint"></div>
      </div>

      <div id="help" class="panel">
        <div class="panel-title"><span data-i18n="helpTitle"></span> <kbd>H</kbd></div>
        <dl id="help-rows"></dl>
      </div>

      <nav id="mobile-controls" data-i18n-aria="mobileControls">
        <button type="button" data-action="orbits" aria-pressed="true" data-i18n="mobileOrbits"></button>
        <button type="button" data-action="labels" aria-pressed="true" data-i18n="mobileLabels"></button>
        <button type="button" data-action="grid" aria-pressed="false" data-i18n="mobileGrid"></button>
        <button type="button" data-action="lagrange" aria-pressed="false" data-i18n="mobileLagrange"></button>
        <button type="button" data-action="time" data-i18n="mobileTime"></button>
        <button type="button" data-action="ui" aria-pressed="true" data-i18n="mobileUi"></button>
      </nav>
    </div>

    <div id="loading">
      <div class="loader-box">
        <div class="loader-title">HELIOS</div>
        <div class="loader-bar"><i id="loader-fill"></i></div>
        <div class="loader-msg" id="loader-msg">·</div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
