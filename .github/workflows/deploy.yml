# Every push to main builds the site and publishes it to GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.
# No gh-pages branch and no tokens are involved.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; a newer push cancels a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # vite build runs scripts/build-textures.mjs first, turning the 8K originals into
      # 2048px webp and taking 66 MB down to 2.5 MB in about five seconds
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
