# 推到 main 就自动构建并发布到 GitHub Pages。
#
# 前置：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
# （只需设置一次；不需要 gh-pages 分支，也不需要任何 token）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # vite build 会先调 scripts/build-textures.mjs：
      # 8K 原图 → 2048px webp，66 MB → 2.5 MB，约 5 秒
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
